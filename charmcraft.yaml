# This file configures Charmcraft.
# See https://canonical-charmcraft.readthedocs-hosted.com/en/stable/reference/files/charmcraft-yaml-file/
type: charm
name: headscale-k8s
title: Headscale
summary: Headscale is an open source, self-hosted implementation of the Tailscale control server.
description: |
  This charm deploys headscale on top of kubernetes.

links:
  contact: mailto:marcus.boden@canonical.com
  issues:
  - https://github.com/marcusboden/headscale-k8s-operator/issues
  source:
  - https://github.com/marcusboden/headscale-k8s-operator
  - https://github.com/juanfont/headscale

base: ubuntu@24.04
platforms:
  amd64:

assumes:
  - k8s-api
  - juju >= 3.1

parts:
  charm:
    source: .
    source-type: local
    charm-requirements:
      - requirements.txt
    build-packages:
      - libssl-dev
      - pkg-config


config:
  options:
    log-level:
      description: |
        Configures the log level of headscale.
      default: "info"
      type: string
    name:
      description: |
        Hostname of the headscale server
      default: headscale
      type: string
    policy:
      description: |
        Policy file to use, see https://headscale.net/stable/ref/acls/
      type: string
    magic-dns:
      description: Name of the tld for the magic DNS. Set to an empty string to disable magic dns
      type: string
      default: headscale.test
    oidc-issuer:
      description: OIDC issuer URL. Required if any other OIDC config options are set.
      type: string
    oidc-client-id:
      description: OIDC Client ID. Required if any other OIDC config options are set.
      type: string
    oidc-secret:
      description: OIDC Client Secret. Required if any other OIDC config options are set.
      type: secret
    oidc-expiry:
      description: |
        Deprecated: use `node-expiry` instead. Kept for backwards compatibility;
        if both are set, `node-expiry` takes precedence.
        Expiration time of nodes added via OIDC. A value of 0 disables this.
        Default: 1d, if nothing configured.
      type: string
    node-expiry:
      description: |
        Default expiration time for node keys (applies to all registration
        methods; tagged nodes registered via a preauth key are exempt
        regardless of this setting). A value of 0 disables this.
        Default: 1d, if nothing configured and OIDC is set up; otherwise unset.
        Replaces the deprecated `oidc-expiry` and takes precedence over it
        if both are set.
      type: string
    oidc-scope:
      description: OIDC scopes. Default '["openid", "profile", "email"]'
      type: string
    oidc-groups:
      description: Groups (as sent by the OIDC provider) that are allowed to login. If not set, all are allowed.
      type: string
    derp-map:
      description: YAML formatted custom DERP map.
      type: string
    derp-map-url:
      description: |
        URL from which to download the DERP map. Will be merged with the custom derp map, if provided.
        No default DERP map is used in this charm. If you want to use the Tailscale's DERP servers, you can add the URL here.
        But keep in mind that that would not be nice.
      type: string
    dns-extra-records:
      description: |
        YAML formatted list of extra records. Each entry containing a dict with "name", "type", and "value" defined.
        Details at https://headscale.net/stable/ref/dns/#setting-extra-dns-records
        Example record
        - name: "grafana.customer.headscale"
          type: "A"
          value: "http://1.2.3.4/cos-ha-grafana"
      type: string
    port:
      description: |
        Custom port for the headscale server to listen on. If not set, defaults to 80 for HTTP and 443 for HTTPS.
        When set, traefik will be configured with a custom entrypoint for this port.
      type: int

containers:
  headscale:
    resource: headscale-image
    mounts:
    - storage: database
      location: /var/lib/headscale

resources:
  headscale-image:
    type: oci-image
    description: |
      OCI image for the headscale container

      see https://github.com/marcusboden/headscale-rock

requires:
  traefik-route:
    interface: traefik_route
    limit: 1
    optional: true
  certificates:
    interface: tls-certificates
    limit: 1
  logging:
    interface: loki_push_api
    optional: true

provides:
  metrics-endpoint:
    interface: prometheus_scrape
    limit: 1
    optional: true

peers:
  headscale-peers:
    interface: headscale-peers

storage:
  database:
    type: filesystem
    description: Storage Volume for the sqlite database

actions:
  create-authkey:
    description: Creates an Auth-key. We don't support different users.
    params:
      tags:
        type: string
        description: Tags to associate with this key
      expiry:
        type: string
        description: Human-readable expiration of the key (e.g. 30m, 24h) (default "1h")
      ephemeral:
        description: Make the Auth-key ephemera;
        type: boolean
      reusable:
        description: Make the Auth-key re-usable
        type: boolean
    required:
    - tags
    additionalProperties: false
  expire-authkey:
    description: Expires an Authkey
    params:
      authkey-id:
        type: integer
        description: Numeric ID of the key to expire (see list-authkeys)
    required:
    - authkey-id
    additionalProperties: false
  list-authkeys:
    description: Lists all Authkeys
    additionalProperties: false
  create-backup:
    description: |
      Creates a backup including the database and the noise key
      and places it into /tmp/backup/headscale-backup-<timestamp>.tar.gz.
      
      The operation returns a command to copy the backup off the machine.
    additionalProperties: false
  restore-backup:
    description: |
      Restores a backup created with the create-backup Action.
      WARNING: THIS OVERWRITES THE CURRENT DATABASE!
      (It does a backup first though, I'm not a monster!)
    params:
      backup-path:
        type: string
        description: Path to the backup file. You will have to manually copy it there first.
    required:
    - backup-path
    additionalProperties: false
  proceed-upgrade:
    description: |
      Confirms that required manual steps for a breaking upgrade have been completed,
      then runs the pre-upgrade backup, any automated migrations, and starts the new
      headscale binary. Needed when the unit is in BlockedStatus after pebble-ready
      detected a manual intervention requirement for this version upgrade.
    additionalProperties: false